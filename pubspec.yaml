name: readify
description: "A comprehensive PDF reader app with secret chat and calling."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: any
  shared_preferences: ^2.2.0
  flutter_tts: ^4.0.0
  flutter_colorpicker: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.2
  wakelock_plus: ^1.1.4
  http: ^1.1.0
  device_info_plus: ^11.0.0
  provider: ^6.1.1
  pdfrx: ^2.2.24
  flutter_volume_controller: ^1.3.4
  vibration: ^3.1.8
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.0
  permission_handler: any

  cupertino_icons: ^1.0.8

  # Firebase Services (Auth, Realtime DB, Storage)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  # Offline Disk Cache & Media Downloader
  dio: ^5.6.0
  cached_network_image: ^3.3.1

  # Audio & Video Calling (ZegoCloud)
  zego_uikit_prebuilt_call: ^4.24.4

  # Media Capture & Audio/Video Playback
  image_picker: ^1.1.2
  just_audio: any
  record: ^5.2.1
  video_player: ^2.9.1

  # Network Status & Sync Engine
  connectivity_plus: ^6.0.5

  # Formatting & Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  record_platform_interface: 1.2.0
  zego_uikit: 2.29.2
  zego_uikit_prebuilt_call: 4.24.4

flutter:
  uses-material-design: true
